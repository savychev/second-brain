# Настройки режима сервера (java -jar second-brain.jar --serve).
# В консольном режиме этот файл не используется — Spring там не запускается.

spring.application.name=second-brain

# Слушаем ТОЛЬКО локальный адрес. Аутентификации в API нет, и до её появления
# сервер не должен быть доступен из сети. Вопрос авторизации решается
# перед этапом 5 (Telegram-бот).
server.address=127.0.0.1
server.port=8080

# Кириллица в логах: обвязка UTF-8 из App на логгер не распространяется,
# а все сообщения в проекте русские.
logging.charset.console=UTF-8

# Баннер Spring при старте не нужен — у приложения свой вывод.
spring.main.banner-mode=off

# Заметки не выбрасывают исключений с секретами, но на всякий случай
# не отдаём наружу стектрейсы.
server.error.include-stacktrace=never
server.error.include-message=always
